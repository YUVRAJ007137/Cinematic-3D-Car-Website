<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#181c2e"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b91c1c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid Lines -->
  <line x1="0" y1="460" x2="1200" y2="460" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="0" y1="490" x2="1200" y2="490" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="530" x2="1200" y2="530" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Underglow -->
  <ellipse cx="600" cy="460" rx="380" ry="18" fill="url(#redGlow)"/>

  <!-- Car Silhouette Outline -->
  <path d="M 280 430 Q 340 370 420 345 Q 520 310 650 310 Q 780 315 880 380 Q 940 410 960 430 L 980 445 L 240 445 Z" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
  <path d="M 440 345 Q 540 280 660 280 Q 740 280 810 345 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

  <!-- Badges & Typography -->
  <text x="600" y="160" font-family="'Cinzel', serif" font-size="20" font-weight="700" letter-spacing="12" fill="#ef4444" text-anchor="middle">A CINEMATIC 3D STUDY</text>
  <text x="600" y="240" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" letter-spacing="6" fill="#ffffff" text-anchor="middle">CHIRON PUR SPORT</text>
  <text x="600" y="280" font-family="'Inter', sans-serif" font-size="16" letter-spacing="3" fill="#94a3b8" text-anchor="middle">REAL-TIME EXPLODED ARCHITECTURE &amp; COMPUTATIONAL AERODYNAMICS</text>

  <!-- Metrics -->
  <g transform="translate(600, 560)">
    <text x="-240" y="0" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">1,500 PS</text>
    <text x="-240" y="22" font-family="'Inter', sans-serif" font-size="11" letter-spacing="1" fill="#64748b" text-anchor="middle">8.0L QUAD-TURBO W16</text>

    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">1,600 NM</text>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="11" letter-spacing="1" fill="#64748b" text-anchor="middle">PEAK TORQUE</text>

    <text x="240" y="0" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">350 KM/H</text>
    <text x="240" y="22" font-family="'Inter', sans-serif" font-size="11" letter-spacing="1" fill="#64748b" text-anchor="middle">TOP TRACK SPEED</text>
  </g>
</svg>
